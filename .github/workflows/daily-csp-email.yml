name: Daily CSP PDF Email

on:
  schedule:
    # GitHub Actions cron uses UTC. 10:00 UTC = 18:00 Asia/Shanghai.
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  send-daily-csp-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CSP_SMTP_PASSWORD: ${{ secrets.CSP_SMTP_PASSWORD }}
      CSP_SMTP_HOST: ${{ secrets.CSP_SMTP_HOST || 'smtp.qq.com' }}
      CSP_SMTP_PORT: ${{ secrets.CSP_SMTP_PORT || '465' }}
      CSP_SMTP_USER: ${{ secrets.CSP_SMTP_USER }}
      CSP_MAIL_FROM: ${{ secrets.CSP_MAIL_FROM }}
      CSP_MAIL_TO: ${{ secrets.CSP_MAIL_TO }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      CSP_SUBJECT_PREFIX: ${{ secrets.CSP_SUBJECT_PREFIX || 'CSP 每日训练' }}
      CSP_QUESTION_PROVIDER: ${{ vars.CSP_QUESTION_PROVIDER || 'ai' }}
      CSP_AI_MODEL: ${{ vars.CSP_AI_MODEL || 'deepseek-flash' }}
      CSP_AI_BASE_URL: ${{ vars.CSP_AI_BASE_URL || 'https://api.deepseek.com' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0
          for name in CSP_SMTP_PASSWORD CSP_SMTP_USER CSP_MAIL_FROM CSP_MAIL_TO; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$CSP_QUESTION_PROVIDER" = "ai" ] && [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::provider=ai but the DEEPSEEK_API_KEY secret is empty; the run would silently fall back to the local question bank."
            missing=1
          fi
          exit "$missing"

      - name: Create cloud config
        shell: bash
        run: |
          cat > config.cloud.ini <<EOF
          [app]
          title = CSP 每日三题训练
          provider = ${CSP_QUESTION_PROVIDER}

          [paths]
          questions_file = data/questions.json
          output_dir = output
          filename_prefix = CSP训练

          [email]
          enabled = true
          smtp_host = ${CSP_SMTP_HOST}
          smtp_port = ${CSP_SMTP_PORT}
          use_ssl = true
          use_starttls = false
          username = ${CSP_SMTP_USER}
          password_env = CSP_SMTP_PASSWORD
          from_addr = ${CSP_MAIL_FROM}
          to_addrs = ${CSP_MAIL_TO}
          subject_prefix = ${CSP_SUBJECT_PREFIX}

          [ai]
          api_key_env = DEEPSEEK_API_KEY
          base_url = ${CSP_AI_BASE_URL}
          model = ${CSP_AI_MODEL}
          timeout = 90
          max_retries = 2
          max_tokens = 8192
          thinking = false
          temperature = 1.0
          fallback_to_static = true
          EOF

      - name: Generate PDF and send email
        shell: bash
        run: |
          set -o pipefail
          python main.py \
            --config config.cloud.ini \
            --require-email \
            --allow-static-fallback 2>&1 | tee run.log

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          source_line=$(grep -m1 'Source:' run.log || true)
          if echo "$source_line" | grep -q 'Source: ai'; then
            verdict='✅ 本次题目由 **AI 生成**'
          elif echo "$source_line" | grep -q 'Source: static'; then
            verdict='⚠️ 本次使用 **本地题库**（可能发生了回退，请查看下方日志中的 `[ai]` 行）'
          else
            verdict='❓ 未找到出题来源记录，请查看下方日志'
          fi
          {
            echo "## CSP 每日训练运行结果"
            echo ""
            echo "$verdict"
            echo ""
            echo "**产物**：\`$(ls output/ 2>/dev/null | tr '\n' ' ')\`"
            echo ""
            echo "<details><summary>完整日志</summary>"
            echo ""
            echo '```text'
            cat run.log 2>/dev/null || echo "（无输出）"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated PDF artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: csp-daily-pdf
          path: output/*.pdf
          if-no-files-found: ignore
