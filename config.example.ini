; 复制为 config.ini 后按需要修改。
; 本地运行：cp config.example.ini config.ini （Windows: copy config.example.ini config.ini）

[app]
title = CSP 每日三题训练
; static = 使用 data/questions.json 题库（离线、稳定）
; ai     = 调用大模型当天生成 3 道题（需要 DEEPSEEK_API_KEY）
provider = ai

[paths]
questions_file = data/questions.json
output_dir = output
filename_prefix = CSP训练

[ai]
; 读取 API Key 的环境变量名，不要把 Key 写进这个文件
api_key_env = DEEPSEEK_API_KEY
base_url = https://api.deepseek.com
model = deepseek-chat
timeout = 60
max_retries = 2
temperature = 1.0
; 为 true 时，AI 出题失败会退回本地题库（需配合 --allow-static-fallback）
fallback_to_static = true

[email]
enabled = false
smtp_host = smtp.qq.com
smtp_port = 465
use_ssl = true
use_starttls = false
username = your_email@qq.com
password_env = CSP_SMTP_PASSWORD
from_addr = your_email@qq.com
to_addrs = your_email@qq.com
subject_prefix = CSP 每日训练
